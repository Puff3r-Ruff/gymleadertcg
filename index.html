<!DOCTYPE html>
<html>
<head>
<style>
/* --- Base Hero --- */
.hero {
  position: relative;
  width: 100%;
  min-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-align: center;
  overflow: hidden;
}

/* --- Image behaves like background-cover --- */
.hero-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

/* --- Overlay for readability --- */
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    rgba(0,0,0,0.55),
    rgba(0,0,0,0.35)
  );
  z-index: 1;
  pointer-events: none;
}

/* --- Content --- */
.hero-content {
  position: relative;
  z-index: 2;
  max-width: 700px;
  padding: 20px;
}

.hero-content h1 {
  font-size: clamp(2rem, 4vw, 3.5rem);
  font-weight: 700;
  margin-bottom: 15px;
  line-height: 1.2;
}

.hero-content p {
  font-size: clamp(1rem, 2vw, 1.4rem);
  margin-bottom: 25px;
  opacity: 0.95;
}

/* --- Button --- */
.hero-content button {
  padding: 14px 36px;
  font-size: 1rem;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  background: #ffffff;
  color: #000;
  cursor: pointer;
  transition: 0.25s ease;
}

.hero-content button:hover {
  background: #f1f1f1;
  transform: translateY(-2px);
}

/* --- Responsive Tweaks --- */
@media (max-width: 600px) {
  .hero {
    min-height: 60vh;
  }
  .hero-content button {
    width: 100%;
  }
}
</style>
<style>
.image-text-section {
  width: 90%;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 auto 0px auto;
  height: 500px;
}

.image-text-section.reverse {
  flex-direction: row-reverse;
}

.image-wrap img {
  width: 100%;
  height: 500px;
  border-radius: 8px;
  object-fit: cover;
}

.text-wrap {

  width: 50%;

}

        .text-wrap p{font-size:1.4rem;}

.text-wrap h3 {

/* REMOVE the mobile stacking */

}
        .text-wrap {
  flex: 1;
  width: 50%;
        padding:0rem;
}
        .text-wrap p {
  padding-bottom:2rem;
        font-size:1rem;
}

}
</style>
